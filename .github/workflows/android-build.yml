name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon :app:testTrialDebugUnitTest :app:testOfficialDebugUnitTest
      - name: Build test and official APKs
        run: gradle --no-daemon :app:assembleTrialDebug :app:assembleOfficialDebug
      - name: Upload free test APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-orbit-test-free
          path: app/build/outputs/apk/trial/debug/app-trial-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload official edition APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: smart-orbit-official-subscriptions-preview
          path: app/build/outputs/apk/official/debug/app-official-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android emulator smoke test
        id: emulator-smoke-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          # The emulator action executes script lines separately; keep this smoke test on one shell line.
          script: adb wait-for-device && adb install -r app/build/outputs/apk/trial/debug/app-trial-debug.apk && adb shell am start -W -n com.smartteck.orbit.trial/.MainActivity 2>&1 | grep -q "Status: ok" && adb shell pidof com.smartteck.orbit.trial && adb install -r app/build/outputs/apk/official/debug/app-official-debug.apk && adb shell am start -W -n com.smartteck.orbit/.MainActivity 2>&1 | grep -q "Status: ok" && adb shell pidof com.smartteck.orbit
      - name: Report emulator smoke test result
        if: always()
        run: |
          if [ "${{ steps.emulator-smoke-test.outcome }}" = "success" ]; then
            echo "Emulator smoke test passed."
          else
            echo "::warning::Emulator smoke test did not pass. The APK was already uploaded."
          fi
