name: Android build
on:
  push:
    branches: [main, feature/orbit-plans-settings]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon :app:testTrialDebugUnitTest :app:testOfficialDebugUnitTest
      - name: Build test and official APKs
        run: gradle --no-daemon :app:assembleTrialDebug :app:assembleOfficialDebug
      - name: Upload free test APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-orbit-test-free
          path: app/build/outputs/apk/trial/debug/app-trial-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload official edition APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: smart-orbit-official-subscriptions-preview
          path: app/build/outputs/apk/official/debug/app-official-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android instrumentation and launch tests
        id: emulator-smoke-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: |
            set -euo pipefail
            adb wait-for-device

            # Execute the existing ActivityScenario instrumentation test in both editions.
            gradle --no-daemon :app:connectedTrialDebugAndroidTest :app:connectedOfficialDebugAndroidTest

            launch_and_check() {
              package="$1"
              component="$package/com.smartteck.orbit.MainActivity"
              adb shell am force-stop "$package" || true
              if ! output="$(adb shell am start -W -n "$component" 2>&1)"; then
                echo "Failed to start $component"
                echo "$output"
                adb logcat -d -t 500
                return 1
              fi
              echo "$output"
              if ! echo "$output" | grep -Fq "Status: ok"; then
                echo "Launcher did not report Status: ok for $package"
                adb logcat -d -t 500
                return 1
              fi
              if ! adb shell pidof "$package"; then
                echo "Process did not remain alive for $package"
                adb logcat -d -t 500
                return 1
              fi
            }

            adb install -r app/build/outputs/apk/trial/debug/app-trial-debug.apk
            launch_and_check com.smartteck.orbit.trial

            adb install -r app/build/outputs/apk/official/debug/app-official-debug.apk
            launch_and_check com.smartteck.orbit
      - name: Report emulator test result
        if: always()
        run: |
          if [ "${{ steps.emulator-smoke-test.outcome }}" = "success" ]; then
            echo "Instrumentation and launch tests passed in both editions."
          else
            echo "::warning::Instrumentation or launch tests failed. APK artifacts were uploaded before emulator tests."
          fi
