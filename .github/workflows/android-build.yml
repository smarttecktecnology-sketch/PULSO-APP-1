name: Android build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle --no-daemon :app:testTrialDebugUnitTest :app:testOfficialDebugUnitTest
      - name: Build test and official APKs
        run: gradle --no-daemon :app:assembleTrialDebug :app:assembleOfficialDebug
      - name: Upload free test APK
        uses: actions/upload-artifact@v4
        with:
          name: smart-orbit-test-free
          path: app/build/outputs/apk/trial/debug/app-trial-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload official edition APK (debug-signed)
        uses: actions/upload-artifact@v4
        with:
          name: smart-orbit-official-subscriptions-preview
          path: app/build/outputs/apk/official/debug/app-official-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Run Android emulator smoke test
        id: emulator-smoke-test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -memory 2048
          script: |
            set -euo pipefail
            adb wait-for-device
            for attempt in $(seq 1 90); do
              if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then
                break
              fi
              sleep 2
            done
            test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
            sleep 10

            launch_and_verify() {
              local apk="$1"
              local package_name="$2"
              echo "Installing $package_name"
              adb install -r "$apk"
              adb shell am force-stop "$package_name" || true
              local launch_output
              launch_output="$(adb shell am start -W -n "$package_name/.MainActivity" 2>&1)"
              echo "$launch_output"
              echo "$launch_output" | grep -q "Status: ok"

              for attempt in $(seq 1 20); do
                if adb shell pidof "$package_name" >/dev/null 2>&1; then
                  echo "$package_name launched successfully."
                  return 0
                fi
                sleep 2
              done

              echo "Application process did not remain alive: $package_name"
              adb logcat -d -s AndroidRuntime:E
              return 1
            }

            launch_and_verify app/build/outputs/apk/trial/debug/app-trial-debug.apk com.smartteck.orbit.trial
            launch_and_verify app/build/outputs/apk/official/debug/app-official-debug.apk com.smartteck.orbit
      - name: Report emulator smoke test result
        if: always()
        run: |
          if [ "${{ steps.emulator-smoke-test.outcome }}" = "success" ]; then
            echo "Emulator smoke test passed."
          else
            echo "::warning::Emulator smoke test did not pass. The APK was already uploaded."
          fi
